name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/sora25.keystore"
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/sora25.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: sora25
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease -PBACKEND_URL="${{ secrets.BACKEND_URL }}"
      - name: Rename APKs to the package name
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do
            case "$f" in
              *universal*) mv "$f" com.sora25new.app.apk ;;
              *) abi=$(echo "$f" | sed -E 's/^app-(.*)-release.*\.apk$/\1/'); mv "$f" "com.sora25new.app-$abi.apk" ;;
            esac
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: com.sora25new.app
          path: app/build/outputs/apk/release/com.sora25new.app*.apk
